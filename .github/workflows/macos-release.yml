name: macOS (dmg + zip)

# Builds "PDF Arranger.app" with its own GTK3 runtime, wraps it into a .dmg
# (drag to Applications) and a .zip, and attaches both to the GitHub release
# when a v* tag is pushed.
#
# Trigger manually (Actions -> macOS (dmg + zip) -> Run workflow) to get the
# artifacts without publishing a release.

on:
  workflow_dispatch:
    inputs:
      gtk_source:
        description: 'GTK3: release = Homebrew bottle (default), branch = build gtk-3-24 HEAD from source (experimental)'
        type: choice
        default: release
        options:
          - release
          - branch
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Homebrew dependencies
        run: |
          brew install pkgconf gtk+3 poppler gobject-introspection gettext adwaita-icon-theme librsvg libhandy

      - name: Build GTK3 from the gtk-3-24 branch (experimental)
        if: inputs.gtk_source == 'branch'
        run: bash packaging/macos/build_gtk_branch.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read application version
        id: version
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" pdfarranger/pdfarranger.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .app, .dmg and .zip
        run: bash packaging/macos/build_app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdfarranger-macos-arm64
          path: release/*
          if-no-files-found: error

      - name: Upload smoke test output (app log + screenshot)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-smoke-test
          path: build/smoke/
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Unofficial macOS build** of PDF Arranger ${{ steps.version.outputs.version }} (Apple Silicon / arm64).

            The app bundles its own GTK3 runtime — no Homebrew, no Nix, nothing else to install.

            ### Install
            1. Download `pdfarranger-${{ steps.version.outputs.version }}-macos-arm64.dmg` below (or the `.zip` if you prefer).
            2. Open the dmg and drag **PDF Arranger** onto **Applications**.
            3. First start: **right-click the app → Open → Open**. The build is not notarized by Apple, so
               this one-time step is required (a plain double-click shows "Apple cannot check it for malware").

            ### Notes
            - Requires macOS 15 (Sequoia) or newer on Apple Silicon.
            - Intel Macs are not supported by this build.
            - Bundles its GTK3/libhandy runtime; includes the fork's macOS fixes (safe drag & drop, GSettings schemas, theme support).
            - Built by GitHub Actions from this repository; `SHA256SUMS` is attached for verification.
            - Update: bump `VERSION` in `pdfarranger/pdfarranger.py`, tag `vX.Y.Z`, push.
